---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-hub-artifacts
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
    - name: pipeline-run-id
      type: string
      default: manual
    - name: infra-id
      type: string
      default: ""
    - name: orphan-stuck-iam
      type: string
      default: "false"
      description: >-
        "true" records remaining IAM resources for follow-up before releasing their
        Crossplane finalizers. Default fails the task after the IAM wait expires.
  steps:
    - name: cleanup
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      envFrom:
        - secretRef:
            name: fleet-iam-read-only
            optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        EXTRA_ARGS=()
        if [[ "$(params.orphan-stuck-iam)" == "true" ]]; then
          EXTRA_ARGS+=(--orphan-stuck-iam)
        fi
        fleet-cleanup-hub-artifacts --cluster-name "$(params.cluster-name)" \
          --pipeline-run-id "$(params.pipeline-run-id)" --infra-id "$(params.infra-id)" "${EXTRA_ARGS[@]}"
