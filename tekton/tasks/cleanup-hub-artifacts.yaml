---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-hub-artifacts
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
    - name: orphan-stuck-iam
      type: string
      default: "false"
      description: >-
        "true" removes Crossplane finalizers from IAM resources still present after the
        timeout, leaving them in AWS for manual deletion. Default fails the task instead.
  steps:
    - name: cleanup
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        EXTRA_ARGS=()
        if [[ "$(params.orphan-stuck-iam)" == "true" ]]; then
          EXTRA_ARGS+=(--orphan-stuck-iam)
        fi
        fleet-cleanup-hub-artifacts --cluster-name "$(params.cluster-name)" "${EXTRA_ARGS[@]}"
