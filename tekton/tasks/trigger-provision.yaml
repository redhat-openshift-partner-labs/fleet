apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trigger-provision
spec:
  params:
    - name: cluster-name
      type: string
    - name: git-repo-url
      type: string
    - name: git-revision
      type: string
    - name: pipeline-image
      type: string
  steps:
    - name: trigger
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        fleet-trigger-provision \
          --cluster-name "$(params.cluster-name)" \
          --git-repo-url "$(params.git-repo-url)" \
          --git-revision "$(params.git-revision)"
