apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: read-cluster-metadata
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
  workspaces:
    - name: source
  results:
    - name: htpasswd-provider-name
      description: Name for the htpasswd identity provider
  steps:
    - name: read-metadata
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        DIR="$(workspaces.source.path)/provision/$(params.cluster-name)"
        META=$(fleet-read-cluster-metadata --cluster-dir "$DIR")
        echo "$META" | jq -r '.["htpasswd-provider-name"] // "htpasswd"' \
          | tee "$(results.htpasswd-provider-name.path)"
