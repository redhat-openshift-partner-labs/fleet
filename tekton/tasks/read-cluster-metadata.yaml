apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: read-cluster-metadata
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
  workspaces:
    - name: source
  results:
    - name: htpasswd-provider-name
      description: Name for the htpasswd identity provider
    - name: openshift-ai-version
      description: OpenShift AI version (v2 or v3)
    - name: platform
      description: Cloud platform (aws or azure)
    - name: aws-credentials-mode
      description: AWS credential workflow (scoped or legacy)
  steps:
    - name: read-metadata
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        DIR="$(workspaces.source.path)/provision/$(params.cluster-name)"
        META=$(fleet-read-cluster-metadata --cluster-dir "$DIR")
        # Tekton keeps result files verbatim and `when` compares exactly:
        # write values without jq's trailing newline.
        result() {
          printf '%s' "$(echo "$META" | jq -r "$2")" | tee "$1"
          echo
        }
        result "$(results.htpasswd-provider-name.path)" '.["htpasswd-provider-name"] // "htpasswd"'
        result "$(results.openshift-ai-version.path)" '.["openshift-ai-version"] // "v3"'
        result "$(results.platform.path)" '.["platform"] // "aws"'
        result "$(results.aws-credentials-mode.path)" '.["aws-credentials-mode"] // "legacy"'
