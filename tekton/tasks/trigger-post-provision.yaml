apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trigger-post-provision
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
    - name: tier
      type: string
    - name: htpasswd-provider-name
      type: string
      default: "htpasswd"
    - name: openshift-ai-version
      type: string
      default: "v3"
    - name: ai-accelerator
      type: string
      default: "nvidia-gpu"
    - name: timezone
      type: string
      default: "America/Chicago"
    - name: schedule
      type: string
      default: "00 08 * * 1-5"
  steps:
    - name: trigger
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        fleet-trigger-post-provision \
          --cluster-name "$(params.cluster-name)" \
          --tier "$(params.tier)" \
          --htpasswd-provider-name "$(params.htpasswd-provider-name)" \
          --openshift-ai-version "$(params.openshift-ai-version)" \
          --ai-accelerator "$(params.ai-accelerator)" \
          --timezone "$(params.timezone)" \
          --schedule "$(params.schedule)"
