---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: delete-cluster-resources
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
  results:
    - name: infra-id
      type: string
  steps:
    - name: delete
      image: $(params.pipeline-image)
      imagePullPolicy: Always
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        oc get clusterdeployment "$(params.cluster-name)" -n "$(params.cluster-name)" \
          --ignore-not-found --request-timeout=30s -o 'jsonpath={.spec.clusterMetadata.infraID}' > "$(results.infra-id.path)"
        fleet-delete-cluster-resources --cluster-name "$(params.cluster-name)"
