apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: apply-coco-workloads
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
    - name: podvm-instance-type
      type: string
    - name: region
      type: string
    - name: vpc-id
      type: string
    - name: subnet-id
      type: string
    - name: sg-ids
      type: string
    - name: ami-id
      type: string
  workspaces:
    - name: source
  steps:
    - name: apply-coco
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        fleet-apply-coco-workloads \
          --cluster-name "$(params.cluster-name)" \
          --source-dir "$(workspaces.source.path)/workloads/coco" \
          --spoke-kubeconfig "$(workspaces.source.path)/kubeconfig" \
          --podvm-instance-type "$(params.podvm-instance-type)" \
          --region "$(params.region)" \
          --vpc-id "$(params.vpc-id)" \
          --subnet-id "$(params.subnet-id)" \
          --sg-ids "$(params.sg-ids)" \
          --ami-id "$(params.ami-id)"
