apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-aws-credentials-manifests
spec:
  params:
    - name: cluster-name
      type: string
    - name: pipeline-image
      type: string
  steps:
    - name: build
      image: $(params.pipeline-image)
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        fleet-build-aws-credentials-manifests \
          --cluster-name "$(params.cluster-name)"
