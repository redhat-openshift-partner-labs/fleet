  <line class="rule" x1="56" y1="138" x2="1206" y2="138"/>
  <text class="t b k" x="56" y="156">Order</text>
  <text class="m b" x="188" y="156">tasks are shown in an order the pipeline allows; the task flowchart shows which tasks run in parallel</text>
  <line class="rule" x1="56" y1="170" x2="1206" y2="170"/>
  <text class="t b k" x="56" y="188">Credential mode</text>
  <text class="m b" x="188" y="188">the two scoped tasks are skipped unless metadata.yaml sets aws-credentials-mode: scoped</text>
  <line class="rule" x1="56" y1="202" x2="1206" y2="202"/>
  <text class="t b k" x="56" y="220">Failure</text>
  <text class="m b" x="188" y="220">a failed task stops the run; trigger-provision does not run</text>

