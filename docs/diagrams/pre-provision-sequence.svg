<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 1778" width="1262" height="1778" role="img" aria-labelledby="title desc">
  <title id="title">pre-provision pipeline: sequence</title>
  <desc id="desc">Sequence of the pre-provision pipeline between pre-provision, Hub API, Git, Crossplane, AWS. load-config: pre-provision to Hub API: get ConfigMap fleet-pipeline-config; Hub API to pre-provision: pipeline parameters. git-clone: pre-provision to Git: clone fleet-clusters at the pushed revision; Git to pre-provision: provision/NAME/ in the workspace. check-prefix-collision: pre-provision to Hub API: list ClusterDeployments, ManagedClusters and IAM resource labels; Hub API to pre-provision: no other cluster has the AWS infra prefix. read-cluster-metadata: Git to pre-provision: metadata.yaml values from the clone, among them aws-credentials-mode. create-cluster-namespace: pre-provision to Hub API: create namespace NAME. create-ssh-key: pre-provision to Hub API: apply Secret NAME-ssh-key with a new ed25519 private key. create-pull-secret: pre-provision to Hub API: copy openshift-config/pull-secret into namespace NAME. apply-crossplane-credentials: pre-provision to Hub API: apply the crossplane overlay of the cluster; Crossplane to AWS: create IAM users, access keys, roles, policies. wait-for-aws-credentials: pre-provision to Hub API: poll for Secret aws-credentials-raw, up to 10m; Crossplane to Hub API: write Secret aws-credentials-raw; Hub API to pre-provision: Secret exists. transform-aws-credentials: pre-provision to Hub API: read aws-credentials-raw, write aws-credentials for Hive. wait-for-aws-component-credentials (runs when aws-credentials-mode is scoped): pre-provision to Hub API: read the operator set from the annotated AccessKeys; Crossplane to Hub API: write one raw Secret per operator; Hub API to pre-provision: every Secret exists, every IAM resource is Ready. build-aws-credentials-manifests (runs when aws-credentials-mode is scoped): pre-provision to Hub API: read the raw Secrets, write Secret NAME-cloud-credentials-manifests. validate-cluster-inputs: pre-provision to Hub API: get aws-credentials, pull-secret and NAME-ssh-key; Hub API to pre-provision: all present. trigger-provision: pre-provision to Hub API: create the PipelineRun of provision with the cloned repository URL and revision. Constraints: Trigger: a push to main of fleet-clusters that adds provision/NAME/, unless the commit message contains [skip-provision]. Order: tasks are shown in an order the pipeline allows; the task flowchart shows which tasks run in parallel. Credential mode: the two scoped tasks are skipped unless metadata.yaml sets aws-credentials-mode: scoped. Failure: a failed task stops the run; trigger-provision does not run.</desc>

