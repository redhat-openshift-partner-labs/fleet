<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 1704" width="1262" height="1704" role="img" aria-labelledby="title desc">
  <title id="title">provision pipeline: sequence</title>
  <desc id="desc">Sequence of the provision pipeline between provision, Hub API, Hive, Crossplane, AWS, Git. load-config: provision to Hub API: get ConfigMap fleet-pipeline-config; Hub API to provision: pipeline parameters. git-clone: provision to Git: clone fleet-clusters; Git to provision: provision/NAME/ in the workspace. read-cluster-metadata: Git to provision: metadata.yaml values from the clone. apply-cluster-crs: provision to Hub API: apply the hive overlay: ClusterDeployment, MachinePool, ManagedCluster and related CRs. wait-for-hive-ready: provision to Hub API: wait for condition Provisioned on the ClusterDeployment, timeout 1h15m; Hive to AWS: install the cluster; AWS to Hive: cluster installed; Hive to Hub API: write the admin kubeconfig Secret, set Provisioned; Hub API to provision: Provisioned. scope-aws-credentials (runs when aws-credentials-mode is scoped): provision to Hub API: read the infra ID from the ClusterDeployment; provision to AWS: find the cluster VPC by its ownership tag; provision to Crossplane: set the infra ID and the VPC in the cluster's IAM policies and roles; Crossplane to AWS: update the IAM policies and roles. wait-for-managed-cluster: provision to Hub API: wait for condition ManagedClusterJoined on the ManagedCluster; Hub API to provision: joined. extract-spoke-kubeconfig: provision to Hub API: read the admin kubeconfig Secret named by the ClusterDeployment; Hub API to provision: kubeconfig in the workspace. read-cluster-tier: provision to Hub API: get the tier label of the ManagedCluster; Hub API to provision: base, virt, ai or coco. label-for-post-provision: provision to Hub API: label the ManagedCluster provisioned=true. trigger-post-provision: provision to Hub API: read baseDomain from the ClusterDeployment; provision to Hub API: create the PipelineRun of the post-provision pipeline, timeout 5h. Constraints: Trigger: the trigger-provision task of the pre-provision pipeline creates the PipelineRun. Order: tasks are shown in an order the pipeline allows; the task flowchart shows which tasks run in parallel. Credential mode: scope-aws-credentials is skipped unless metadata.yaml sets aws-credentials-mode: scoped. Failure: a failed task stops the run; trigger-post-provision does not run.</desc>

