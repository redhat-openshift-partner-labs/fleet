  <text class="c b" x="76" y="1148">verify-deprovision</text>
  <circle class="badge-src" cx="58" cy="1278" r="10"/><text class="badge-t" x="58" y="1282" text-anchor="middle">7</text>
  <text class="c b" x="76" y="1282">create-deployment-status</text>

  <!-- ===== Messages ===== -->
  <path class="flow" d="M380 324 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="317">get ConfigMap fleet-pipeline-config</text>
  <path class="ctl" d="M620 354 H382" marker-end="url(#a-ctl)"/>
  <text class="m s" x="388" y="347">pipeline parameters</text>
  <path class="flow" d="M380 428 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="407">read the tier label, and for coco</text>
  <text class="m s" x="388" y="421">delete the peer-pods AccessKey</text>
  <path class="flow" d="M380 472 H1048" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="451">for coco: terminate pod VMs, delete</text>
  <text class="m s" x="388" y="465">the pod VM image and its snapshots</text>
  <path class="ctl" d="M1050 502 H382" marker-end="url(#a-ctl)"/>
  <text class="m s" x="388" y="495">no pod VMs left</text>
  <path class="flow" d="M380 576 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="555">delete KlusterletAddonConfig,</text>
  <text class="m s" x="388" y="569">ManagedCluster, MachinePools</text>
  <path class="flow" d="M380 606 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="599">delete ClusterDeployment</text>
  <path class="ctl" d="M620 636 H382" marker-end="url(#a-ctl)"/>
  <text class="m s" x="388" y="629">infra-id</text>
  <path class="flow" d="M380 710 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="689">wait for the ClusterDeployment to be</text>
  <text class="m s" x="388" y="703">gone, timeout 30m</text>
  <path class="flow" d="M770 768 H1048" marker-end="url(#a-flow)"/>
  <text class="m s" x="778" y="733">uninstall: delete</text>
  <text class="m s" x="778" y="747">the cluster's AWS</text>
  <text class="m s" x="778" y="761">resources</text>
  <path class="ctl" d="M1050 798 H772" marker-end="url(#a-ctl)"/>
  <text class="m s" x="778" y="791">resources deleted</text>
  <path class="flow" d="M770 828 H622" marker-end="url(#a-flow)"/>
  <text class="m s" x="628" y="821">remove finalizer</text>
  <path class="ctl" d="M620 858 H382" marker-end="url(#a-ctl)"/>
  <text class="m s" x="388" y="851">ClusterDeployment gone</text>
  <path class="flow" d="M380 932 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="911">delete Certificate, ClusterIssuer and</text>
  <text class="m s" x="388" y="925">the cert-manager Secret</text>
  <path class="flow" d="M380 976 H908" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="955">delete the cluster's IAM resources,</text>
  <text class="m s" x="388" y="969">wait up to 10m</text>
  <path class="flow" d="M910 1034 H1048" marker-end="url(#a-flow)"/>
  <text class="m s" x="918" y="999">delete IAM users,</text>
  <text class="m s" x="918" y="1013">keys, roles,</text>
  <text class="m s" x="918" y="1027">policies</text>
  <path class="ctl" d="M910 1064 H382" marker-end="url(#a-ctl)"/>
  <text class="m s" x="388" y="1057">IAM resources gone</text>
  <path class="flow" d="M380 1094 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="1087">delete CronJob and namespace NAME</text>
  <path class="flow" d="M380 1168 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="1147">get namespace, ManagedCluster,</text>
  <text class="m s" x="388" y="1161">ClusterDeployment, CronJob</text>
  <path class="flow" d="M380 1198 H908" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="1191">list the cluster's IAM resources</text>
  <path class="ctl" d="M910 1228 H382" marker-end="url(#a-ctl)"/>
  <text class="m s" x="388" y="1221">none remain</text>
  <path class="flow" d="M380 1302 H618" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="1281">read the GitHub App key Secret and</text>
  <text class="m s" x="388" y="1295">the IAM cleanup report</text>
  <path class="flow" d="M380 1360 H1168" marker-end="url(#a-flow)"/>
  <text class="m s" x="388" y="1325">create deployment in fleet-clusters</text>
  <text class="m s" x="388" y="1339">(environment deprovision), set status</text>
  <text class="m s" x="388" y="1353">success</text>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="40" y1="1428" x2="1222" y2="1428"/>
  <path class="flow" d="M40 1456 H76" marker-end="url(#a-flow)"/>
  <text class="m s" x="86" y="1460">call</text>
  <path class="ctl" d="M144 1456 H180" marker-end="url(#a-ctl)"/>
