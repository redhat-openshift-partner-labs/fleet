  <line class="rule" x1="52" y1="528" x2="358" y2="528"/>
  <text class="m s" x="52" y="550">applies the hive overlay: ClusterDeployment,</text>
  <text class="m s" x="52" y="568">MachinePool, ManagedCluster and related CRs</text>
  <rect class="core" x="466" y="488" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="484" cy="508" r="10"/><text class="badge-t" x="484" y="512" text-anchor="middle">5</text>
  <text class="t h2" x="500" y="513">wait-for-hive-ready</text>
  <line class="rule" x1="478" y1="528" x2="784" y2="528"/>
  <text class="m s" x="478" y="550">waits for condition Provisioned on the</text>
  <text class="m s" x="478" y="568">ClusterDeployment; timeout 1h15m</text>
  <rect class="core" x="466" y="680" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="484" cy="700" r="10"/><text class="badge-t" x="484" y="704" text-anchor="middle">6</text>
