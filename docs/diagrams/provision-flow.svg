  <line class="rule" x1="52" y1="336" x2="358" y2="336"/>
  <text class="m s" x="52" y="358">reads ConfigMap fleet-pipeline-config; its results</text>
  <text class="m s" x="52" y="376">are parameters of the later tasks</text>
  <rect class="src" x="466" y="296" width="330" height="98" rx="12"/>
  <circle class="badge-src" cx="484" cy="316" r="10"/><text class="badge-t" x="484" y="320" text-anchor="middle">2</text>
