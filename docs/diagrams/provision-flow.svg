  <text class="m s" x="904" y="376">are parameters of post-provision</text>
  <rect class="core" x="40" y="488" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="58" cy="508" r="10"/><text class="badge-t" x="58" y="512" text-anchor="middle">4</text>
