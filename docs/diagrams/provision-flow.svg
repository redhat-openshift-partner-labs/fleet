<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 1398" width="1262" height="1398" role="img" aria-labelledby="title desc">
  <title id="title">provision pipeline</title>
  <desc id="desc">The provision pipeline has 11 tasks. Inputs: load-config (reads ConfigMap fleet-pipeline-config; its results are parameters of the later tasks); git-clone (clones fleet-clusters at the revision of pre-provision into the shared workspace); read-cluster-metadata (reads provision/NAME/metadata.yaml; its results are parameters of post-provision). Install: apply-cluster-crs (applies the hive overlay: ClusterDeployment, MachinePool, ManagedCluster and related CRs); wait-for-hive-ready (waits for condition Provisioned on the ClusterDeployment; timeout 1h15m). Fleet membership: wait-for-managed-cluster (waits for condition ManagedClusterJoined on the ManagedCluster); extract-spoke-kubeconfig (extracts the admin kubeconfig from the Hive Secret into the workspace); read-cluster-tier (reads the tier label of the ManagedCluster: base, virt, ai or coco); label-for-post-provision (labels the ManagedCluster provisioned=true). scoped mode: scope-aws-credentials (binds the IAM policies and roles to the installed cluster's infra ID and VPC). Handover: trigger-post-provision (creates the PipelineRun of the post-provision pipeline with the tier and the metadata values; run timeout 5h). read-cluster-metadata runs after git-clone. apply-cluster-crs runs after git-clone. wait-for-hive-ready runs after apply-cluster-crs. scope-aws-credentials runs after wait-for-hive-ready. scope-aws-credentials runs after read-cluster-metadata. wait-for-managed-cluster runs after wait-for-hive-ready. extract-spoke-kubeconfig runs after wait-for-managed-cluster. read-cluster-tier runs after wait-for-managed-cluster. label-for-post-provision runs after extract-spoke-kubeconfig. trigger-post-provision runs after label-for-post-provision. trigger-post-provision runs after read-cluster-tier. trigger-post-provision runs after read-cluster-metadata. trigger-post-provision runs after scope-aws-credentials. Constraints: Trigger: the trigger-provision task of the pre-provision pipeline creates the PipelineRun with the repository URL and revision it cloned. Start: load-config and git-clone have no runAfter and start first. Credential mode: scope-aws-credentials is skipped unless metadata.yaml sets aws-credentials-mode: scoped. Failure: a failed task stops the run; trigger-post-provision does not run.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 650; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; }
    .k { font-weight: 650; }

    .src  { fill: #e6f6f4; stroke: #1f8f84; }
    .gate { fill: #fff4e0; stroke: #c27c0e; }
    .core { fill: #ecf2ff; stroke: #3b6fd8; }
    .out  { fill: #f3ecff; stroke: #7a4fd6; }
    .store{ fill: #eaf7ec; stroke: #2e8b46; }
    .deny { fill: #fdecec; stroke: #d1242f; }
    .user { fill: #f6f8fa; stroke: #6e7781; }

    /* badge fills are darker than card strokes so the white digit reaches 4.5:1 */
    .badge-src  { fill: #1c8278; }
    .badge-gate { fill: #a3680c; }
    .badge-core { fill: #3b6fd8; }
    .badge-out  { fill: #7a4fd6; }
    .badge-store{ fill: #2c8543; }
    .badge-t    { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }

    .flow  { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .ctl   { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .link  { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .rule  { stroke: #d0d7de; stroke-width: 1; }
    .ah-flow { fill: #57606a; }
    .ah-ctl  { fill: #6e7781; }
    .x { stroke: #d1242f; stroke-width: 2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .frame { fill: #151b23; stroke: #30363d; }
      .t, .c { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .src  { fill: #0f2a28; stroke: #3fb8a9; }
      .gate { fill: #2e2310; stroke: #e3a33b; }
      .core { fill: #14213d; stroke: #6d9bff; }
      .out  { fill: #251a40; stroke: #a888ff; }
      .store{ fill: #112a19; stroke: #4cc06a; }
      .deny { fill: #3a1417; stroke: #ff6b6b; }
      .user { fill: #161b22; stroke: #6e7681; }
      .badge-src  { fill: #3fb8a9; }
      .badge-gate { fill: #e3a33b; }
      .badge-core { fill: #6d9bff; }
      .badge-out  { fill: #a888ff; }
      .badge-store{ fill: #4cc06a; }
      .badge-t    { fill: #0d1117; }
      .flow  { stroke: #8b949e; }
      .ctl   { stroke: #768390; }
      .link  { stroke: #768390; }
      .rule  { stroke: #30363d; }
      .ah-flow { fill: #8b949e; }
      .ah-ctl  { fill: #768390; }
      .x { stroke: #ff6b6b; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="1261" height="1397" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">provision pipeline</text>
  <text class="m b" x="40" y="68">Eleven tasks apply the cluster resources, wait for the install and the ACM join, then start the post-provision pipeline.</text>

  <!-- ===== Constraints ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="1182" height="138" rx="12"/>
  <text class="t b k" x="56" y="124">Trigger</text>
  <text class="m b" x="188" y="124">the trigger-provision task of the pre-provision pipeline creates the PipelineRun with the repository URL and revision it cloned</text>
  <line class="rule" x1="56" y1="138" x2="1206" y2="138"/>
  <text class="t b k" x="56" y="156">Start</text>
  <text class="m b" x="188" y="156">load-config and git-clone have no runAfter and start first</text>
  <line class="rule" x1="56" y1="170" x2="1206" y2="170"/>
  <text class="t b k" x="56" y="188">Credential mode</text>
  <text class="m b" x="188" y="188">scope-aws-credentials is skipped unless metadata.yaml sets aws-credentials-mode: scoped</text>
  <line class="rule" x1="56" y1="202" x2="1206" y2="202"/>
  <text class="t b k" x="56" y="220">Failure</text>
  <text class="m b" x="188" y="220">a failed task stops the run; trigger-post-provision does not run</text>

