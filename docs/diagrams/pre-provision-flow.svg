  <text class="m s" x="52" y="408">are parameters of the later tasks</text>
  <rect class="src" x="466" y="328" width="330" height="98" rx="12"/>
  <circle class="badge-src" cx="484" cy="348" r="10"/><text class="badge-t" x="484" y="352" text-anchor="middle">2</text>
  <text class="t h2" x="500" y="353">git-clone</text>
  <line class="rule" x1="478" y1="368" x2="784" y2="368"/>
