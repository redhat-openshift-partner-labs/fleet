  <text class="m s" x="478" y="1120">writes Secret NAME-cloud-credentials-manifests</text>
  <text class="m s" x="478" y="1138">for the Hive install manifests</text>
  <rect class="core" x="466" y="1250" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="484" cy="1270" r="10"/><text class="badge-t" x="484" y="1274" text-anchor="middle">13</text>
  <text class="t h2" x="500" y="1275">validate-cluster-inputs</text>
  <line class="rule" x1="478" y1="1290" x2="784" y2="1290"/>
  <text class="m s" x="478" y="1312">fails if aws-credentials, pull-secret or</text>
  <text class="m s" x="478" y="1330">NAME-ssh-key is missing</text>
  <rect class="core" x="892" y="1250" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="910" cy="1270" r="10"/><text class="badge-t" x="910" y="1274" text-anchor="middle">14</text>
