  <text class="m s" x="478" y="408">into the shared workspace</text>
  <rect class="core" x="892" y="328" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="910" cy="348" r="10"/><text class="badge-t" x="910" y="352" text-anchor="middle">3</text>
  <text class="t h2" x="926" y="353">check-prefix-collision</text>
  <line class="rule" x1="904" y1="368" x2="1210" y2="368"/>
  <text class="m s" x="904" y="390">fails if another cluster in git, on the hub or in</text>
  <text class="m s" x="904" y="408">IAM labels has the same AWS infra prefix</text>
  <rect class="src" x="40" y="520" width="330" height="98" rx="12"/>
  <circle class="badge-src" cx="58" cy="540" r="10"/><text class="badge-t" x="58" y="544" text-anchor="middle">4</text>
  <text class="t h2" x="74" y="545">read-cluster-metadata</text>
  <line class="rule" x1="52" y1="560" x2="358" y2="560"/>
  <text class="m s" x="52" y="582">reads provision/NAME/metadata.yaml;</text>
  <text class="m s" x="52" y="600">result aws-credentials-mode</text>
  <rect class="core" x="892" y="520" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="910" cy="540" r="10"/><text class="badge-t" x="910" y="544" text-anchor="middle">5</text>
  <text class="t h2" x="926" y="545">create-cluster-namespace</text>
  <line class="rule" x1="904" y1="560" x2="1210" y2="560"/>
  <text class="m s" x="904" y="582">creates namespace NAME on the hub</text>
  <rect class="core" x="466" y="674" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="484" cy="694" r="10"/><text class="badge-t" x="484" y="698" text-anchor="middle">6</text>
