  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="1261" height="1469" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">pre-provision pipeline</text>
  <text class="m b" x="40" y="68">Fourteen tasks check the cluster definition, create the hub namespace, secrets and AWS credentials, then start the provision pipeline.</text>

  <!-- ===== Constraints ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="1182" height="170" rx="12"/>
  <text class="t b k" x="56" y="124">Trigger</text>
  <text class="m b" x="188" y="124">a push to main of fleet-clusters that adds provision/NAME/, unless the commit message contains [skip-provision]</text>
  <line class="rule" x1="56" y1="138" x2="1206" y2="138"/>
  <text class="t b k" x="56" y="156">Parameters</text>
  <text class="m b" x="188" y="156">cluster-name, git-repo-url and git-revision come from the push event; the others from ConfigMap fleet-pipeline-config</text>
  <line class="rule" x1="56" y1="170" x2="1206" y2="170"/>
  <text class="t b k" x="56" y="188">Start</text>
  <text class="m b" x="188" y="188">load-config and git-clone have no runAfter and start first</text>
  <line class="rule" x1="56" y1="202" x2="1206" y2="202"/>
  <text class="t b k" x="56" y="220">Credential mode</text>
  <text class="m b" x="188" y="220">the two scoped tasks are skipped unless metadata.yaml sets aws-credentials-mode: scoped</text>
  <line class="rule" x1="56" y1="234" x2="1206" y2="234"/>
  <text class="t b k" x="56" y="252">Failure</text>
  <text class="m b" x="188" y="252">a failed task stops the run; trigger-provision does not run</text>

