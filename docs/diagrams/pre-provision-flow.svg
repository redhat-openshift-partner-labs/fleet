  <rect class="core" x="466" y="1058" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="484" cy="1078" r="10"/><text class="badge-t" x="484" y="1082" text-anchor="middle">12</text>
  <text class="t h2" x="500" y="1083">build-aws-credentials-manifests</text>
