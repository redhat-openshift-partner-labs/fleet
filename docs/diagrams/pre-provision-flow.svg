  <line class="rule" x1="478" y1="714" x2="784" y2="714"/>
  <text class="m s" x="478" y="736">generates an ed25519 key pair;</text>
  <text class="m s" x="478" y="754">stores Secret NAME-ssh-key</text>
  <rect class="core" x="892" y="674" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="910" cy="694" r="10"/><text class="badge-t" x="910" y="698" text-anchor="middle">7</text>
