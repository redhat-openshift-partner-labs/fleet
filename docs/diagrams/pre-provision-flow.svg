<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 1470" width="1262" height="1470" role="img" aria-labelledby="title desc">
  <title id="title">pre-provision pipeline</title>
  <desc id="desc">The pre-provision pipeline has 14 tasks. Inputs: load-config (reads ConfigMap fleet-pipeline-config; its results are parameters of the later tasks); git-clone (clones fleet-clusters at the pushed revision into the shared workspace); check-prefix-collision (fails if another cluster in git, on the hub or in IAM labels has the same AWS infra prefix). Metadata, namespace and secrets: read-cluster-metadata (reads provision/NAME/metadata.yaml; result aws-credentials-mode); create-cluster-namespace (creates namespace NAME on the hub); create-ssh-key (generates an ed25519 key pair; stores Secret NAME-ssh-key); create-pull-secret (copies openshift-config/pull-secret into the cluster namespace). AWS credentials: apply-crossplane-credentials (applies the cluster's crossplane overlay: IAM users, access keys, roles, policies); wait-for-aws-credentials (waits up to 10m for Secret aws-credentials-raw, which Crossplane writes); transform-aws-credentials (writes Secret aws-credentials in the format Hive reads). aws-credentials-mode: scoped: wait-for-aws-component-credentials (waits for every operator's raw Secret and for all IAM resources of the cluster to be Ready); build-aws-credentials-manifests (writes Secret NAME-cloud-credentials-manifests for the Hive install manifests). Handover: validate-cluster-inputs (fails if aws-credentials, pull-secret or NAME-ssh-key is missing); trigger-provision (creates the PipelineRun of the provision pipeline). check-prefix-collision runs after git-clone. read-cluster-metadata runs after check-prefix-collision. create-cluster-namespace runs after check-prefix-collision. create-ssh-key runs after create-cluster-namespace. create-pull-secret runs after create-cluster-namespace. apply-crossplane-credentials runs after create-ssh-key. apply-crossplane-credentials runs after create-pull-secret. wait-for-aws-credentials runs after apply-crossplane-credentials. transform-aws-credentials runs after wait-for-aws-credentials. wait-for-aws-component-credentials runs after transform-aws-credentials. build-aws-credentials-manifests runs after wait-for-aws-component-credentials. validate-cluster-inputs runs after transform-aws-credentials. validate-cluster-inputs runs after build-aws-credentials-manifests. trigger-provision runs after validate-cluster-inputs. Constraints: Trigger: a push to main of fleet-clusters that adds provision/NAME/, unless the commit message contains [skip-provision]. Parameters: cluster-name, git-repo-url and git-revision come from the push event; the others from ConfigMap fleet-pipeline-config. Start: load-config and git-clone have no runAfter and start first. Credential mode: the two scoped tasks are skipped unless metadata.yaml sets aws-credentials-mode: scoped. Failure: a failed task stops the run; trigger-provision does not run.</desc>

