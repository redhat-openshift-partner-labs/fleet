  <text class="m s" x="478" y="946">which Crossplane writes</text>
  <rect class="core" x="892" y="866" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="910" cy="886" r="10"/><text class="badge-t" x="910" y="890" text-anchor="middle">10</text>
