<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 896" width="1262" height="896" role="img" aria-labelledby="title desc">
  <title id="title">test-vcluster pipeline</title>
  <desc id="desc">The test-vcluster pipeline has 5 tasks. Configuration: load-config (reads ConfigMap fleet-pipeline-config; its result pipeline-image is the image of the later tasks). vCluster test: create-test-vcluster (checks the name, runs vcluster create and writes the kubeconfig to the workspace); seed-test-vcluster (creates the labelled namespace NAME, two Secrets and the ManagedCluster with the tier label); run-post-provision (creates a post-provision PipelineRun with openshift-cluster=false and waits for it). Cleanup: delete-test-vcluster (finally task: deletes the ManagedCluster, the Route, the vCluster, the labelled namespace NAME, the CronJob and the Secret NAME-spoke-kubeconfig). create-test-vcluster runs after load-config. seed-test-vcluster runs after create-test-vcluster. run-post-provision runs after seed-test-vcluster. delete-test-vcluster runs after run-post-provision. Constraints: Purpose: runs post-provision against a temporary vCluster on the hub. Parameters: cluster-name and namespace are required; tier defaults to base. Order: the first four tasks run in order; a failed task stops them. Cleanup: delete-test-vcluster is the finally task; it runs after the fourth task and after a failed task. Name check: create, seed and delete exit 1 when a ClusterDeployment has the name or its ManagedCluster lacks cloud=vcluster.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 650; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; }
    .k { font-weight: 650; }

    .src  { fill: #e6f6f4; stroke: #1f8f84; }
    .gate { fill: #fff4e0; stroke: #c27c0e; }
    .core { fill: #ecf2ff; stroke: #3b6fd8; }
    .out  { fill: #f3ecff; stroke: #7a4fd6; }
    .store{ fill: #eaf7ec; stroke: #2e8b46; }
    .deny { fill: #fdecec; stroke: #d1242f; }
    .user { fill: #f6f8fa; stroke: #6e7781; }

    /* badge fills are darker than card strokes so the white digit reaches 4.5:1 */
    .badge-src  { fill: #1c8278; }
    .badge-gate { fill: #a3680c; }
    .badge-core { fill: #3b6fd8; }
    .badge-out  { fill: #7a4fd6; }
    .badge-store{ fill: #2c8543; }
    .badge-t    { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }

    .flow  { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .ctl   { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .link  { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .rule  { stroke: #d0d7de; stroke-width: 1; }
    .ah-flow { fill: #57606a; }
    .ah-ctl  { fill: #6e7781; }
    .x { stroke: #d1242f; stroke-width: 2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .frame { fill: #151b23; stroke: #30363d; }
      .t, .c { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .src  { fill: #0f2a28; stroke: #3fb8a9; }
      .gate { fill: #2e2310; stroke: #e3a33b; }
      .core { fill: #14213d; stroke: #6d9bff; }
      .out  { fill: #251a40; stroke: #a888ff; }
      .store{ fill: #112a19; stroke: #4cc06a; }
      .deny { fill: #3a1417; stroke: #ff6b6b; }
      .user { fill: #161b22; stroke: #6e7681; }
      .badge-src  { fill: #3fb8a9; }
      .badge-gate { fill: #e3a33b; }
      .badge-core { fill: #6d9bff; }
      .badge-out  { fill: #a888ff; }
      .badge-store{ fill: #4cc06a; }
      .badge-t    { fill: #0d1117; }
      .flow  { stroke: #8b949e; }
      .ctl   { stroke: #768390; }
      .link  { stroke: #768390; }
      .rule  { stroke: #30363d; }
      .ah-flow { fill: #8b949e; }
      .ah-ctl  { fill: #768390; }
      .x { stroke: #ff6b6b; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="1261" height="895" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">test-vcluster pipeline</text>
  <text class="m b" x="40" y="68">Four tasks create a vCluster on the hub and run post-provision against it; the finally task deletes what they created.</text>

  <!-- ===== Constraints ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="1182" height="170" rx="12"/>
  <text class="t b k" x="56" y="124">Purpose</text>
  <text class="m b" x="160" y="124">runs post-provision against a temporary vCluster on the hub</text>
  <line class="rule" x1="56" y1="138" x2="1206" y2="138"/>
  <text class="t b k" x="56" y="156">Parameters</text>
  <text class="m b" x="160" y="156">cluster-name and namespace are required; tier defaults to base</text>
  <line class="rule" x1="56" y1="170" x2="1206" y2="170"/>
  <text class="t b k" x="56" y="188">Order</text>
  <text class="m b" x="160" y="188">the first four tasks run in order; a failed task stops them</text>
  <line class="rule" x1="56" y1="202" x2="1206" y2="202"/>
  <text class="t b k" x="56" y="220">Cleanup</text>
  <text class="m b" x="160" y="220">delete-test-vcluster is the finally task; it runs after the fourth task and after a failed task</text>
  <line class="rule" x1="56" y1="234" x2="1206" y2="234"/>
  <text class="t b k" x="56" y="252">Name check</text>
  <text class="m b" x="160" y="252">create, seed and delete exit 1 when a ClusterDeployment has the name or its ManagedCluster lacks cloud=vcluster</text>

  <!-- ===== Frames ===== -->
  <rect class="frame" x="24" y="302" width="1214" height="122" rx="14"/>
  <rect class="bg" x="40" y="292" width="134" height="20" rx="10"/>
  <text class="m lbl" x="52" y="306">CONFIGURATION</text>
  <rect class="frame" x="24" y="476" width="1214" height="140" rx="14"/>
  <rect class="bg" x="40" y="466" width="134" height="20" rx="10"/>
  <text class="m lbl" x="52" y="480">VCLUSTER TEST</text>
  <rect class="frame" x="24" y="668" width="1214" height="122" rx="14"/>
  <rect class="bg" x="40" y="658" width="84" height="20" rx="10"/>
  <text class="m lbl" x="52" y="672">CLEANUP</text>

  <!-- ===== Cards ===== -->
  <rect class="src" x="40" y="328" width="1182" height="80" rx="12"/>
  <circle class="badge-src" cx="58" cy="348" r="10"/><text class="badge-t" x="58" y="352" text-anchor="middle">1</text>
  <text class="t h2" x="74" y="353">load-config</text>
  <line class="rule" x1="52" y1="368" x2="1210" y2="368"/>
  <text class="m s" x="52" y="390">reads ConfigMap fleet-pipeline-config; its result pipeline-image is the image of the later tasks</text>
  <rect class="core" x="40" y="502" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="58" cy="522" r="10"/><text class="badge-t" x="58" y="526" text-anchor="middle">2</text>
  <text class="t h2" x="74" y="527">create-test-vcluster</text>
  <line class="rule" x1="52" y1="542" x2="358" y2="542"/>
  <text class="m s" x="52" y="564">checks the name, runs vcluster create and</text>
  <text class="m s" x="52" y="582">writes the kubeconfig to the workspace</text>
  <rect class="core" x="466" y="502" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="484" cy="522" r="10"/><text class="badge-t" x="484" y="526" text-anchor="middle">3</text>
  <text class="t h2" x="500" y="527">seed-test-vcluster</text>
  <line class="rule" x1="478" y1="542" x2="784" y2="542"/>
  <text class="m s" x="478" y="564">creates the labelled namespace NAME, two Secrets</text>
  <text class="m s" x="478" y="582">and the ManagedCluster with the tier label</text>
  <rect class="core" x="892" y="502" width="330" height="98" rx="12"/>
  <circle class="badge-core" cx="910" cy="522" r="10"/><text class="badge-t" x="910" y="526" text-anchor="middle">4</text>
  <text class="t h2" x="926" y="527">run-post-provision</text>
  <line class="rule" x1="904" y1="542" x2="1210" y2="542"/>
  <text class="m s" x="904" y="564">creates a post-provision PipelineRun with</text>
  <text class="m s" x="904" y="582">openshift-cluster=false and waits for it</text>
  <rect class="core" x="40" y="694" width="1182" height="80" rx="12"/>
  <circle class="badge-core" cx="58" cy="714" r="10"/><text class="badge-t" x="58" y="718" text-anchor="middle">5</text>
  <text class="t h2" x="74" y="719">delete-test-vcluster</text>
  <line class="rule" x1="52" y1="734" x2="1210" y2="734"/>
  <text class="m s" x="52" y="756">finally task: deletes the ManagedCluster, the Route, the vCluster, the labelled namespace NAME, the CronJob and the Secret NAME-spoke-kubeconfig</text>

  <!-- ===== Edges ===== -->
  <path class="flow" d="M205 408 V500" marker-end="url(#a-flow)"/>
  <path class="flow" d="M370 551 H464" marker-end="url(#a-flow)"/>
  <path class="flow" d="M796 551 H890" marker-end="url(#a-flow)"/>
  <path class="flow" d="M1057 600 V692" marker-end="url(#a-flow)"/>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="40" y1="830" x2="1222" y2="830"/>
  <path class="flow" d="M40 858 H76" marker-end="url(#a-flow)"/>
  <text class="m s" x="86" y="862">runs next</text>
  <rect class="src" x="174" y="850" width="22" height="16" rx="4"/>
  <text class="m s" x="204" y="862">workspace, git, configuration</text>
  <rect class="core" x="412" y="850" width="22" height="16" rx="4"/>
  <text class="m s" x="442" y="862">hub Kubernetes API</text>
</svg>
