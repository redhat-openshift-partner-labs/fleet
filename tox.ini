[tox]
envlist = test, yamllint, black, mypy, pylint, bandit
skipsdist = false

[testenv:test]
deps =
    pytest
    pytest-cov
commands = pytest -v --cov fleet --cov-report term-missing --cov-fail-under 100

[testenv:yamllint]
deps = yamllint
commands = yamllint -c .yamllint .

[testenv:tekton-lint]
allowlist_externals = npx
commands = npx tekton-lint 'tekton/tasks/*.yaml' 'tekton/pipelines/*.yaml' 'tekton/triggers/*.yaml'

[testenv:validate-kustomize]
allowlist_externals = kustomize
commands =
    kustomize build workloads/ai
    kustomize build workloads/ai/common
    kustomize build workloads/ai/common/v2
    kustomize build workloads/ai/common/v3
    kustomize build workloads/ai/cpu
    kustomize build workloads/ai/gpu
    kustomize build workloads/base
    kustomize build workloads/virt

[testenv:black]
deps = black
commands = black --check fleet/ tests/

[testenv:mypy]
deps =
    mypy
    types-pyyaml
    types-requests
    boto3-stubs[ec2]
commands = mypy fleet/

[testenv:pylint]
deps = pylint
commands = pylint fleet/

[testenv:bandit]
deps = bandit
commands = bandit -c pyproject.toml -r fleet/
